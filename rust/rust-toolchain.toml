[toolchain]
channel = "1.98.1"
targets = [
  # macOS
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",

  # iOS
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",

  # Android
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",

  # Linux
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",

  # Windows
  "aarch64-pc-windows-msvc",
  "x86_64-pc-windows-msvc"
]
