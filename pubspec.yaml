name: stow
description: "A blazing fast native key-value local storage package for Flutter and Dart using Rust and FFI."
version: 0.0.1
homepage:

environment:
  sdk: ^3.13.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  ffi: ^2.2.0
  hooks: ^2.2.0
  native_toolchain_rust: ^1.0.7
  logging: ^1.3.0

dev_dependencies:
  ffigen: ^22.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: any

  # To add custom fonts to your plugin package, add a fonts section here,
